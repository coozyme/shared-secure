name: CI

on:
  pull_request:
  # Pushes to main run CI through deploy.yml, which calls this workflow before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (incl. module boundaries)
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Worker runtime types are up to date
        run: pnpm --filter @shared/worker exec wrangler types --include-env=false --check

      - name: Typecheck
        run: pnpm typecheck

      # Web builds first because the Worker's asset directory and bundle test depend on it.
      - name: Build
        run: pnpm build

      - name: Test (unit, Worker, bundle isolation)
        run: pnpm test

      - name: Security header assertions (wrangler dev)
        run: pnpm test:headers

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Needs network access to challenges.cloudflare.com for Turnstile's test keys.
      - name: End-to-end tests (Playwright against wrangler dev)
        run: pnpm test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Dependency audit
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown
