version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tooling:
        dependency-type: development
    ignore:
      # Held back until typescript-eslint and svelte-check support TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @cloudflare/vitest-plugin pins the supported Vitest range.
      - dependency-name: vitest
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
